name: Build Windows Installer

# Builds TUNBEEC-Setup.exe on a real Windows runner (PyInstaller can't cross-compile from
# macOS/Linux) and hands it back as a downloadable artifact -- so a Windows installer can be
# produced without owning a Windows machine.
#
# Trigger manually from the Actions tab ("Run workflow"), or push a tag like v1.0.0 to also
# attach the installer to a GitHub Release.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r python_tunbeec/requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Run PyInstaller
        working-directory: windows_exe
        run: pyinstaller tunbeec.spec --distpath dist --workpath build --noconfirm

      - name: Build installer with Inno Setup
        working-directory: windows_exe
        run: iscc installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUNBEEC-Setup
          path: windows_exe/installer_output/TUNBEEC-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows_exe/installer_output/TUNBEEC-Setup.exe
