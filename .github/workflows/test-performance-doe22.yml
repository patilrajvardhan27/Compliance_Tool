name: Test Performance Compliance (DOE-2.2)

# Runs the Performance Approach pipeline end-to-end on a real Windows runner, once with an
# untouched "New Project" default building and once with clearly different user-edited values,
# using the real bundled RUN22.exe (DOE-2.2). This is the only way to verify the performance
# compliance check actually completes and responds to input, since RUN22.exe is a Windows-only
# binary that doesn't run on macOS/Linux (and not under Wine either -- see python_tunbeec/INSTALL.md).

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_tunbeec/requirements.txt

      - name: Run performance pipeline (default values + custom values)
        working-directory: python_tunbeec
        run: python scripts/ci_test_performance.py

      - name: Upload generated .inp/.BDL/.sim files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doe22-output
          path: python_tunbeec/PROJECT/ci_out/
          if-no-files-found: warn
